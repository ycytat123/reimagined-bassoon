<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超低音箱阵列计算器</title>
<style>
  :root {
    --bg: #1a1d23; --surface: #21252b; --border: #333842;
    --text: #d4d4d4; --text-secondary: #8b949e;
    --accent: #e8a840; --accent-glow: rgba(232,168,64,0.15);
    --danger: #f44747; --warning: #e8a840; --success: #4ec9b0; --info: #569cd6;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; justify-content: center; padding: 24px;
  }
  .container { max-width: 880px; width: 100%; }
  h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 28px; }
  .tabs {
    display: flex; gap: 2px; background: var(--surface);
    border-radius: var(--radius); padding: 4px; margin-bottom: 24px; border: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 10px 16px; text-align: center; cursor: pointer;
    border-radius: 6px; font-size: 0.9rem; font-weight: 500;
    color: var(--text-secondary); transition: all 0.15s;
    border: none; background: transparent; font-family: inherit;
  }
  .tab:hover { color: #fff; }
  .tab.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
  }
  .panel-title {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-secondary); margin-bottom: 16px;
  }
  .section-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary); margin-bottom: 10px; margin-top: 4px;
    padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 100px; margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
  .form-group input {
    width: 100%; padding: 10px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; color: #fff;
    font-size: 0.95rem; font-family: 'SF Mono','Cascadia Code','Consolas',monospace;
    transition: border-color 0.15s;
  }
  .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .form-group input:disabled { opacity: 0.35; cursor: not-allowed; }
  .form-group .unit { font-size: 0.75rem; color: var(--text-secondary); margin-left: 2px; }
  .form-group .hint { font-size: 0.68rem; color: var(--text-secondary); margin-top: 3px; font-style: italic; }
  .info-callout {
    background: var(--bg); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 0 6px 6px 0;
    font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.5;
  }
  .info-callout strong { color: var(--accent); }
  .warn-callout {
    background: rgba(232,168,64,0.08); border-left: 3px solid var(--warning);
    padding: 10px 14px; border-radius: 0 6px 6px 0;
    font-size: 0.82rem; color: var(--warning); margin-bottom: 16px; line-height: 1.5;
  }
  .warn-callout.error { background: rgba(244,71,71,0.08); border-left-color: var(--danger); color: var(--danger); }
  .warn-callout.info { background: rgba(86,156,214,0.06); border-left-color: var(--info); color: var(--info); }
  .summary-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .summary-card {
    flex: 1; min-width: 100px; background: var(--bg); border-radius: 6px;
    padding: 14px 16px; text-align: center; border: 1px solid var(--border);
  }
  .summary-card.constrained { border-color: var(--warning); }
  .summary-card .value {
    font-size: 1.3rem; font-weight: 700; color: #fff;
    font-family: 'SF Mono','Cascadia Code','Consolas',monospace;
  }
  .summary-card .value.warn { color: var(--warning); }
  .summary-card .value.accent { color: var(--accent); }
  .summary-card .label { font-size: 0.72rem; color: var(--text-secondary); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th {
    text-align: left; padding: 10px 14px; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary); border-bottom: 1px solid var(--border); font-weight: 600;
  }
  td {
    padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.04);
    font-family: 'SF Mono','Cascadia Code','Consolas',monospace;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .col-num { color: var(--text-secondary); width: 36px; }
  .col-x, .col-y { color: var(--success); }
  .col-delay { color: var(--accent); font-weight: 600; }
  .col-polarity { font-weight: 600; }
  .polarity-pos { color: var(--success); }
  .polarity-neg { color: var(--danger); }
  .no-results { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 0.9rem; }
  .diagram-container { margin-top: 24px; }
  .diagram-container canvas { width: 100%; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); }
  .legend-row {
    display: flex; align-items: center; gap: 6px; justify-content: center;
    margin-top: 10px; font-size: 0.68rem; color: var(--text-secondary);
  }
  .legend-bar {
    width: 300px; height: 14px; border-radius: 2px; border: 1px solid var(--border);
  }
  .legend-ticks {
    display: flex; justify-content: space-between; width: 300px;
    margin: 2px auto 0; font-size: 0.62rem; color: var(--text-secondary);
  }
  @media (max-width: 680px) {
    body { padding: 12px; } .panel { padding: 16px; }
    .form-row { flex-direction: column; gap: 0; } .form-group { min-width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>超低音箱阵列计算器</h1>
  <p class="subtitle">Subwoofer Array Calculator — 弧形阵列 / 端射阵列 / 心形阵列</p>

  <div class="tabs">
    <button class="tab active" data-type="arc">弧形阵列 Arc</button>
    <button class="tab" data-type="endfire">端射阵列 End-Fire</button>
    <button class="tab" data-type="cardioid">心形阵列 FBF</button>
  </div>

  <div class="panel" id="input-panel">
    <div class="panel-title">输入参数</div>

    <div class="section-label">阵列参数</div>
    <div class="form-row">
      <div class="form-group">
        <label for="numSubs">音箱数量</label>
        <input type="number" id="numSubs" value="4" min="1" max="32" step="1">
      </div>
      <div class="form-group" id="arc-angle-group">
        <label for="arcAngle">覆盖角度 <span class="unit">(°)</span></label>
        <input type="number" id="arcAngle" value="90" min="1" max="360" step="1">
      </div>
      <div class="form-group" id="arc-width-group">
        <label for="maxWidth">可用宽度 <span class="unit">(m)</span></label>
        <input type="number" id="maxWidth" value="6" min="0.1" max="100" step="0.1">
      </div>
      <div class="form-group" id="arc-depth-group">
        <label for="maxDepth">可用深度 <span class="unit">(m)</span></label>
        <input type="number" id="maxDepth" value="1.5" min="0" max="100" step="0.1">
        <div class="hint">0 = 直线，纯延时</div>
      </div>
    </div>

    <div class="section-label">箱体尺寸 <span class="unit">(mm)</span></div>
    <div class="form-row">
      <div class="form-group"><label for="cabWidth">宽 W</label><input type="number" id="cabWidth" value="600" min="100" max="3000" step="1"></div>
      <div class="form-group"><label for="cabHeight">高 H</label><input type="number" id="cabHeight" value="500" min="100" max="3000" step="1"></div>
      <div class="form-group"><label for="cabDepth">深 D</label><input type="number" id="cabDepth" value="600" min="100" max="3000" step="1"></div>
    </div>

    <div class="section-label">声学参数</div>
    <div class="form-row">
      <div class="form-group">
        <label for="couplingFreq">耦合频率 <span class="unit">(Hz)</span></label>
        <input type="number" id="couplingFreq" value="80" min="20" max="200" step="1">
      </div>
      <div class="form-group">
        <label for="speedOfSound">声速 <span class="unit">(m/s)</span></label>
        <input type="number" id="speedOfSound" value="343" min="330" max="360" step="1">
      </div>
    </div>

    <div class="section-label">覆盖图坐标范围 <span class="unit">(m)</span></div>
    <div class="form-row">
      <div class="form-group">
        <label for="gridXMin">X 最小</label>
        <input type="number" id="gridXMin" value="-9" min="-100" max="100" step="0.5">
      </div>
      <div class="form-group">
        <label for="gridXMax">X 最大</label>
        <input type="number" id="gridXMax" value="9" min="-100" max="100" step="0.5">
      </div>
      <div class="form-group">
        <label for="gridYMin">Y 最小（后方）</label>
        <input type="number" id="gridYMin" value="-4" min="-100" max="100" step="0.5">
      </div>
      <div class="form-group">
        <label for="gridYMax">Y 最大（前方）</label>
        <input type="number" id="gridYMax" value="12" min="-100" max="200" step="0.5">
      </div>
    </div>
    <div class="info-callout" id="info-callout"></div>
  </div>

  <div class="panel" id="results-panel">
    <div class="panel-title">计算结果</div>
    <div id="results-content" class="no-results">调整参数后自动计算…</div>
  </div>
</div>

<script>
// =============================================================================
// Utils
// =============================================================================
function roundTo(v, d) { var f = Math.pow(10, d); return Math.round(v * f) / f; }

// =============================================================================
// Array calculations
// =============================================================================
function calcArcArray(N, covAng, freq, maxW, maxD, cabW_mm, cabH_mm, cabD_mm, c) {
  var wavelength = c / freq, acousticSpacing = wavelength / 2;
  var covRad = covAng * Math.PI / 180, cabW_m = cabW_mm / 1000;
  var warnings = [];
  if (N <= 1) {
    return { type:'arc', positions:[{x:0,y:0}], delays:[0], polarity:[1],
      recSpacing:roundTo(acousticSpacing,3), actualSpacing:0, virtualR:0, covRad:covRad,
      wavelength:roundTo(wavelength,3), totalWidth:0, maxWidth:maxW, maxDepth:maxD,
      freq:freq, c:c, spacingLimitedByCab:false,
      cabinetW:cabW_mm, cabinetH:cabH_mm, cabinetD:cabD_mm, warnings:warnings };
  }
  var spacing = acousticSpacing, limitedByCab = false;
  if (spacing < cabW_m) { spacing = cabW_m; limitedByCab = true;
    warnings.push('间距 λ/2 ('+roundTo(acousticSpacing,3)+' m) < 箱体宽度 ('+cabW_m.toFixed(3)+' m)，已提升至箱体宽度。'); }
  var idealSpan = (N-1)*spacing, totalSpan = Math.min(idealSpan, maxW), actualSpacing = totalSpan/(N-1);
  if (idealSpan > maxW) warnings.push('可用宽度不足：需 '+roundTo(idealSpan,2)+' m，可用 '+maxW+' m，已压缩。');
  var virtualR = (covAng < 180) ? (totalSpan/2)/Math.sin(covRad/2) : totalSpan/2;
  var positions = [], delays = [];
  for (var i=0; i<N; i++) {
    var x = -totalSpan/2 + i*actualSpacing, vd = 0;
    if (Math.abs(x) < virtualR) vd = virtualR - Math.sqrt(virtualR*virtualR - x*x);
    else vd = virtualR * (1 - Math.cos(covRad/2));
    positions.push({x:roundTo(x,3), y:0});
    delays.push(roundTo(vd/c*1000, 2));
  }
  return { type:'arc', positions:positions, delays:delays, polarity:new Array(N).fill(1),
    recSpacing:roundTo(acousticSpacing,3), actualSpacing:roundTo(actualSpacing,3),
    virtualR:roundTo(virtualR,3), covRad:covRad, wavelength:roundTo(wavelength,3),
    totalWidth:roundTo(totalSpan,3), maxWidth:maxW, maxDepth:maxD, freq:freq, c:c,
    spacingLimitedByCab:limitedByCab,
    cabinetW:cabW_mm, cabinetH:cabH_mm, cabinetD:cabD_mm, warnings:warnings };
}

function calcEndfireArray(N, freq, cabW_mm, cabH_mm, cabD_mm, c) {
  var wavelength = c/freq, acousticSpacing = wavelength/4, cabD_m = cabD_mm/1000, warnings = [];
  if (N <= 1) {
    return { type:'endfire', positions:[{x:0,y:0}], delays:[0], polarity:[1],
      recSpacing:roundTo(acousticSpacing,3), actualSpacing:0, wavelength:roundTo(wavelength,3),
      totalDepth:0, freq:freq, c:c, spacingLimitedByCab:false,
      cabinetW:cabW_mm, cabinetH:cabH_mm, cabinetD:cabD_mm, warnings:warnings };
  }
  var spacing = acousticSpacing, limitedByCab = false;
  if (spacing < cabD_m) { spacing = cabD_m; limitedByCab = true;
    warnings.push('间距 λ/4 ('+roundTo(acousticSpacing,3)+' m) < 箱体深度 ('+cabD_m.toFixed(3)+' m)，已提升至箱体深度。'); }
  var positions = [], delays = [];
  for (var i=0; i<N; i++) {
    positions.push({x:0, y:roundTo(-i*spacing, 3)});
    delays.push(roundTo((N-1-i)*spacing/c*1000, 2));
  }
  return { type:'endfire', positions:positions, delays:delays, polarity:new Array(N).fill(1),
    recSpacing:roundTo(acousticSpacing,3), actualSpacing:roundTo(spacing,3),
    wavelength:roundTo(wavelength,3), totalDepth:roundTo((N-1)*spacing,3),
    freq:freq, c:c, spacingLimitedByCab:limitedByCab,
    cabinetW:cabW_mm, cabinetH:cabH_mm, cabinetD:cabD_mm, warnings:warnings };
}

function calcCardioidFBF(freq, cabW_mm, cabH_mm, cabD_mm, c) {
  var wavelength = c/freq, acousticSpacing = wavelength/4, cabW_m = cabW_mm/1000, warnings = [];
  var spacing = acousticSpacing, limitedByCab = false;
  if (spacing < cabW_m) { spacing = cabW_m; limitedByCab = true;
    warnings.push('间距 λ/4 ('+roundTo(acousticSpacing,3)+' m) < 箱体宽度 ('+cabW_m.toFixed(3)+' m)，已提升至箱体宽度。'); }
  return { type:'cardioid',
    positions: [{x:roundTo(-spacing,3),y:0},{x:0,y:0},{x:roundTo(spacing,3),y:0}],
    delays: [0, roundTo(spacing/c*1000,2), 0], polarity: [1,-1,1],
    recSpacing:roundTo(acousticSpacing,3), actualSpacing:roundTo(spacing,3),
    wavelength:roundTo(wavelength,3), totalWidth:roundTo(2*spacing,3),
    freq:freq, c:c, spacingLimitedByCab:limitedByCab,
    cabinetW:cabW_mm, cabinetH:cabH_mm, cabinetD:cabD_mm, warnings:warnings };
}

// =============================================================================
// SPL Field
// =============================================================================
function computeSPLField(result, gridRes, xMin, xMax, yMin, yMax) {
  var N = result.positions.length, freq = result.freq, c = result.c;
  var omega = 2*Math.PI*freq;
  var dx = (xMax-xMin)/gridRes, dy = (yMax-yMin)/gridRes;
  var speakers = [];
  for (var i=0; i<N; i++) {
    var delayS = result.delays[i]/1000;
    var pol = (result.polarity && result.polarity[i] !== undefined) ? result.polarity[i] : 1;
    speakers.push({sx:result.positions[i].x, sy:result.positions[i].y, delayS:delayS, pol:pol});
  }
  var grid = [], minSPL = Infinity, maxSPL = -Infinity;
  for (var iy=0; iy<gridRes; iy++) {
    var row = [], py = yMin + iy*dy;
    for (var ix=0; ix<gridRes; ix++) {
      var px = xMin + ix*dx, re=0, im=0;
      for (var k=0; k<N; k++) {
        var sp = speakers[k];
        var dist = Math.sqrt((px-sp.sx)*(px-sp.sx) + (py-sp.sy)*(py-sp.sy));
        if (dist < 0.01) dist = 0.01;
        var phase = -omega * (sp.delayS + dist/c);
        var mag = sp.pol / dist;
        re += mag*Math.cos(phase); im += mag*Math.sin(phase);
      }
      var ampl = Math.sqrt(re*re+im*im), refA = N;
      var spl = 20 * Math.log10(ampl/refA);
      if (spl < minSPL) minSPL = spl; if (spl > maxSPL) maxSPL = spl;
      row.push(spl);
    }
    grid.push(row);
  }
  if (minSPL < -30) minSPL = -30;
  return {grid:grid, minSPL:minSPL, maxSPL:maxSPL, xMin:xMin, xMax:xMax, yMin:yMin, yMax:yMax, dx:dx, dy:dy};
}

// =============================================================================
// SPL Color — precomputed 256-entry LUT, 3dB per step
// =============================================================================
var splColorLUT = (function() {
  var stops = [
    {pos:0.00, r:220,g:38,b:38},   // 0dB   red
    {pos:0.10, r:240,g:80,b:28},   // -3dB  red-orange
    {pos:0.20, r:238,g:145,b:18},  // -6dB  orange
    {pos:0.30, r:228,g:180,b:22},  // -9dB  yellow-orange
    {pos:0.40, r:200,g:205,b:28},  // -12dB yellow
    {pos:0.50, r:148,g:198,b:32},  // -15dB yellow-green
    {pos:0.60, r:92,g:178,b:36},   // -18dB light green
    {pos:0.70, r:48,g:155,b:38},   // -21dB green
    {pos:0.80, r:22,g:122,b:34},   // -24dB medium green
    {pos:0.90, r:10,g:85,b:22},    // -27dB dark green
    {pos:1.00, r:6,g:55,b:16}      // -30dB deep green
  ];
  var lut = new Uint8Array(256 * 3); // R,G,B triplets
  for (var i = 0; i < 256; i++) {
    var v = i / 255;
    var lo = stops[0], hi = stops[stops.length - 1];
    for (var s = 0; s < stops.length - 1; s++) {
      if (v >= stops[s].pos && v <= stops[s + 1].pos) { lo = stops[s]; hi = stops[s + 1]; break; }
    }
    var t = (v - lo.pos) / (hi.pos - lo.pos);
    lut[i * 3]     = Math.round(lo.r + (hi.r - lo.r) * t);
    lut[i * 3 + 1] = Math.round(lo.g + (hi.g - lo.g) * t);
    lut[i * 3 + 2] = Math.round(lo.b + (hi.b - lo.b) * t);
  }
  return lut;
})();

function splColorRGB(spl, maxSPL) {
  // Returns {r,g,b} directly — no string parsing
  var v = (maxSPL - spl) / 30; // 0 = maxSPL (red), 1 = maxSPL-30 (dark green)
  var idx = Math.max(0, Math.min(255, Math.round(v * 255)));
  return {
    r: splColorLUT[idx * 3],
    g: splColorLUT[idx * 3 + 1],
    b: splColorLUT[idx * 3 + 2]
  };
}

// =============================================================================
// SPL Heatmap Canvas
// =============================================================================
function drawSPLHeatmap(canvas, result, splField) {
  var ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
  var rect = canvas.parentElement.getBoundingClientRect();
  var w = rect.width, h = 420;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var pad = {top:38, right:24, bottom:34, left:44};
  var plotW = w-pad.left-pad.right, plotH = h-pad.top-pad.bottom;
  var sf = splField;
  var scaleX = plotW/(sf.xMax-sf.xMin), scaleY = plotH/(sf.yMax-sf.yMin);
  var scale = Math.min(scaleX, scaleY);
  var plotWused = (sf.xMax-sf.xMin)*scale, plotHused = (sf.yMax-sf.yMin)*scale;
  var offX = pad.left + (plotW-plotWused)/2, offY = pad.top + (plotH-plotHused)/2;
  function sx(px) { return offX + (px-sf.xMin)*scale; }
  function sy(py) { return offY + (sf.yMax-py)*scale; }

  ctx.fillStyle = '#1a1d23'; ctx.fillRect(0,0,w,h);

  // Heatmap via ImageData with bilinear interpolation
  var grid = sf.grid, res = grid.length;
  var iw = Math.ceil(plotWused), ih = Math.ceil(plotHused);
  var imgData = ctx.createImageData(iw, ih);
  var maxSPL = sf.maxSPL;
  for (var iy = 0; iy < ih; iy++) {
    var wy = sf.yMax - (iy / scale);            // world Y for this pixel row
    var gyf = (wy - sf.yMin) / sf.dy;           // fractional grid index
    var gy0 = Math.max(0, Math.min(res - 1, Math.floor(gyf)));
    var gy1 = Math.max(0, Math.min(res - 1, gy0 + 1));
    var fy = gyf - gy0;

    for (var ix = 0; ix < iw; ix++) {
      var wx = sf.xMin + (ix / scale);
      var gxf = (wx - sf.xMin) / sf.dx;
      var gx0 = Math.max(0, Math.min(res - 1, Math.floor(gxf)));
      var gx1 = Math.max(0, Math.min(res - 1, gx0 + 1));
      var fx = gxf - gx0;

      var pi = (iy * iw + ix) * 4;
      // Skip very low SPL (below floor)
      var s00 = grid[gy0][gx0], s10 = grid[gy1][gx0];
      var s01 = grid[gy0][gx1], s11 = grid[gy1][gx1];
      if (s00 <= sf.minSPL + 0.5 && s10 <= sf.minSPL + 0.5 &&
          s01 <= sf.minSPL + 0.5 && s11 <= sf.minSPL + 0.5) {
        imgData.data[pi + 3] = 0; // transparent
        continue;
      }

      // Bilinear interpolation of SPL values
      var spl = (1 - fy) * ((1 - fx) * s00 + fx * s01) +
                     fy  * ((1 - fx) * s10 + fx * s11);
      if (spl < sf.minSPL) spl = sf.minSPL;

      var c = splColorRGB(spl, maxSPL);
      imgData.data[pi]     = c.r;
      imgData.data[pi + 1] = c.g;
      imgData.data[pi + 2] = c.b;
      imgData.data[pi + 3] = 210; // alpha
    }
  }
  ctx.putImageData(imgData, offX, offY);

  // Grid lines with coordinate labels
  var gridStep = (function(){
    var raw = (sf.xMax-sf.xMin)/5, exp = Math.pow(10,Math.floor(Math.log10(raw)));
    var m = raw/exp; return (m>=5?5:m>=2?2:1)*exp;
  })();

  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 0.5;
  ctx.fillStyle = '#8b949e'; ctx.font = '9px "SF Mono","Cascadia Code",monospace';
  ctx.textAlign = 'center';
  for (var gx = Math.ceil(sf.xMin/gridStep)*gridStep; gx <= sf.xMax; gx += gridStep) {
    var psx = sx(gx);
    ctx.beginPath(); ctx.moveTo(psx, offY); ctx.lineTo(psx, offY+plotHused); ctx.stroke();
    ctx.fillText(gx % 1 === 0 ? gx : gx.toFixed(1), psx, offY+plotHused+14);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var gy = Math.ceil(sf.yMin/gridStep)*gridStep; gy <= sf.yMax; gy += gridStep) {
    var psy = sy(gy);
    ctx.beginPath(); ctx.moveTo(offX, psy); ctx.lineTo(offX+plotWused, psy); ctx.stroke();
    ctx.fillText(gy % 1 === 0 ? gy : gy.toFixed(1), offX-6, psy);
  }

  // Origin axis
  var ox = sx(0), oy = sy(0);
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(offX, oy); ctx.lineTo(offX+plotWused, oy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox, offY); ctx.lineTo(ox, offY+plotHused); ctx.stroke();

  // Audience
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(offX, offY, plotWused, 8);
  ctx.fillStyle = '#8b949e'; ctx.font = '11px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('观众方向 ↑', w/2, pad.top-14);

  // Unit labels
  ctx.fillStyle = '#8b949e'; ctx.font = '9px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('X (m)', offX+plotWused/2, offY+plotHused+26);
  ctx.save(); ctx.translate(offX-18, offY+plotHused/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign = 'center'; ctx.fillText('Y (m)', 0, 0); ctx.restore();

  // Speakers
  var cabW_m = (result.cabinetW||600)/1000, cabD_m = (result.cabinetD||600)/1000;
  var rw = Math.max(3, cabW_m*scale/2), rh = Math.max(3, cabD_m*scale/2);
  result.positions.forEach(function(pos,i){
    var px = sx(pos.x), py = sy(pos.y);
    if (px<offX-10||px>offX+plotWused+10||py<offY-10||py>offY+plotHused+10) return;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(px-rw-2, py-rh-2, (rw+2)*2, (rh+2)*2);
    ctx.fillStyle = '#e8a840'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.fillRect(px-rw, py-rh, rw*2, rh*2); ctx.strokeRect(px-rw, py-rh, rw*2, rh*2);
    var isR = result.type==='cardioid' && result.polarity && result.polarity[i]===-1;
    if (!isR) { var aL=Math.min(rh*0.7,10); ctx.fillStyle='#1a1d23'; ctx.beginPath();
      ctx.moveTo(px,py-rh-aL*0.3); ctx.lineTo(px-aL*0.45,py-rh+aL*0.2); ctx.lineTo(px+aL*0.45,py-rh+aL*0.2); ctx.closePath(); ctx.fill(); }
    if (isR) { ctx.fillStyle='#f44747'; ctx.beginPath(); ctx.arc(px,py,Math.min(rw,rh)*0.5,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.font = Math.max(8,Math.min(rw,rh)*0.8)+'px "SF Mono","Cascadia Code",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(i+1, px, py-rh-3);
  });

  // Virtual arc
  if (result.type==='arc' && result.virtualR>0 && result.virtualR<500) {
    var vcx=sx(0), vcy=sy(-result.virtualR), vr=result.virtualR*scale, ha=result.covRad/2;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.arc(vcx,vcy,vr,-Math.PI/2-ha,-Math.PI/2+ha); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '9px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('虚拟弧波阵面', sx(result.totalWidth/2)+4, oy-2);
  }
}

// =============================================================================
// Layout diagram
// =============================================================================
function drawLayoutDiagram(canvas, result) {
  var ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio||1;
  var rect = canvas.parentElement.getBoundingClientRect();
  var w = rect.width, h = 180;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var positions = result.positions;
  var allX = positions.map(function(p){return p.x;});
  var allY = positions.map(function(p){return p.y;});
  var arcMinY = 0;
  if (result.type==='arc' && result.virtualR>0) arcMinY = -result.virtualR*(1-Math.cos(result.covRad/2));
  var minX = Math.min.apply(null, allX.concat([result.maxWidth?-result.maxWidth/2:-1, -0.5]));
  var maxX = Math.max.apply(null, allX.concat([result.maxWidth?result.maxWidth/2:1, 0.5]));
  var minY = Math.min.apply(null, allY.concat([arcMinY, result.maxDepth?-result.maxDepth-0.5:-1]));
  var maxY = Math.max.apply(null, allY.concat([0.5]));
  var rangeX = maxX-minX||1, rangeY = maxY-minY||1;
  var pad = {top:30, right:40, bottom:26, left:40};
  var plotW = w-pad.left-pad.right, plotH = h-pad.top-pad.bottom;
  var scale = Math.min(plotW/rangeX, plotH/rangeY);
  var offX = pad.left+(plotW-rangeX*scale)/2, offY = pad.top+(plotH-rangeY*scale)/2;
  function sx(px){return offX+(px-minX)*scale;}
  function sy(py){return offY+(maxY-py)*scale;}

  ctx.fillStyle = '#1a1d23'; ctx.fillRect(0,0,w,h);
  var gridStep = (function(){var raw=rangeX/3, exp=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/exp; return (m>=5?5:m>=2?2:1)*exp;})();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (var gx=Math.floor(minX/gridStep)*gridStep; gx<=maxX; gx+=gridStep) { ctx.beginPath(); ctx.moveTo(sx(gx),pad.top); ctx.lineTo(sx(gx),h-pad.bottom); ctx.stroke(); }
  for (var gy=Math.floor(minY/gridStep)*gridStep; gy<=maxY; gy+=gridStep) { ctx.beginPath(); ctx.moveTo(pad.left,sy(gy)); ctx.lineTo(w-pad.right,sy(gy)); ctx.stroke(); }
  var ox=sx(0), oy=sy(0);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left,oy); ctx.lineTo(w-pad.right,oy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox,pad.top); ctx.lineTo(ox,h-pad.bottom); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(pad.left,pad.top,plotW,8);
  ctx.fillStyle = '#8b949e'; ctx.font = '10px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('观众方向 ↑', w/2, pad.top-10);

  if (result.type==='arc' && result.virtualR>0 && result.virtualR<500) {
    var vcx=sx(0), vcy=sy(-result.virtualR), vr=result.virtualR*scale, ha=result.covRad/2;
    ctx.strokeStyle = 'rgba(232,168,64,0.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.arc(vcx,vcy,vr,-Math.PI/2-ha,-Math.PI/2+ha); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(232,168,64,0.5)'; ctx.font = '9px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('虚拟弧', sx(result.totalWidth/2)+6, oy-2);
  }

  var cabW_m = (result.cabinetW||600)/1000, cabD_m = (result.cabinetD||600)/1000;
  var rw = Math.max(4, cabW_m*scale/2), rh = Math.max(4, cabD_m*scale/2);
  positions.forEach(function(pos,i){
    var px=sx(pos.x), py=sy(pos.y);
    ctx.fillStyle = 'rgba(232,168,64,0.15)'; ctx.fillRect(px-rw-2,py-rh-2,(rw+2)*2,(rh+2)*2);
    ctx.fillStyle = '#e8a840'; ctx.strokeStyle = '#1a1d23'; ctx.lineWidth = 1.5;
    ctx.fillRect(px-rw,py-rh,rw*2,rh*2); ctx.strokeRect(px-rw,py-rh,rw*2,rh*2);
    var isR = result.type==='cardioid' && result.polarity && result.polarity[i]===-1;
    if (!isR) { var aL=Math.min(rh*0.8,12); ctx.fillStyle='#1a1d23'; ctx.beginPath();
      ctx.moveTo(px,py-rh-aL*0.3); ctx.lineTo(px-aL*0.45,py-rh+aL*0.2); ctx.lineTo(px+aL*0.45,py-rh+aL*0.2); ctx.closePath(); ctx.fill(); }
    if (isR) { ctx.fillStyle='#f44747'; ctx.beginPath(); ctx.arc(px,py,Math.min(rw,rh)*0.5,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.font = Math.max(9,Math.min(rw,rh)*0.85)+'px "SF Mono","Cascadia Code",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(i+1, px, py-rh-4);
  });
  ctx.fillStyle = '#8b949e'; ctx.font = '9px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('网格: '+roundTo(gridStep,2)+' m · 箱体: '+cabW_m.toFixed(2)+'×'+cabD_m.toFixed(2)+' m', w-pad.right, h-4);
}

// =============================================================================
// UI
// =============================================================================
var currentType = 'arc';
var infoTexts = {
  arc: '音箱<strong>直线排列</strong>，全部面朝前方。通过<strong>电子延时</strong>将波阵面弯曲为向前凸的弧形——<strong>中心延时=0</strong>（弧顶），<strong>边缘延时最大</strong>（弧尾）。覆盖角度为 θ。',
  endfire: '音箱<strong>前后排列</strong>，全部面朝前方。间距 = max(λ/4, 箱体深度)。后方先发声，前方延时 d/c，波束向前叠加，后方抵消。',
  cardioid: '<strong>FBF 水平心形</strong>：3 只水平排列。中间朝后+反转+延时；两侧面朝前无延时。间距 = max(λ/4, 箱体宽度)。'
};

function readInputs() {
  return {
    numSubs: parseFloat(document.getElementById('numSubs').value)||4,
    arcAngle: parseFloat(document.getElementById('arcAngle').value)||90,
    maxWidth: parseFloat(document.getElementById('maxWidth').value)||6,
    maxDepth: parseFloat(document.getElementById('maxDepth').value)||1.5,
    couplingFreq: parseFloat(document.getElementById('couplingFreq').value)||80,
    c: parseFloat(document.getElementById('speedOfSound').value)||343,
    cabW: parseFloat(document.getElementById('cabWidth').value)||600,
    cabH: parseFloat(document.getElementById('cabHeight').value)||500,
    cabD: parseFloat(document.getElementById('cabDepth').value)||600,
    gxMin: parseFloat(document.getElementById('gridXMin').value)||-9,
    gxMax: parseFloat(document.getElementById('gridXMax').value)||9,
    gyMin: parseFloat(document.getElementById('gridYMin').value)||-4,
    gyMax: parseFloat(document.getElementById('gridYMax').value)||12
  };
}

function updateUI() {
  var inp = readInputs();
  var isArc = currentType==='arc';
  document.getElementById('arc-angle-group').style.display = isArc?'':'none';
  document.getElementById('arc-width-group').style.display = isArc?'':'none';
  document.getElementById('arc-depth-group').style.display = isArc?'':'none';
  document.getElementById('info-callout').innerHTML = infoTexts[currentType];
  var ns = document.getElementById('numSubs');
  if (currentType==='cardioid') { ns.disabled=true; ns.value=3; } else { ns.disabled=false; }

  var N = currentType==='cardioid'?3:Math.max(1,Math.min(32,inp.numSubs));
  var angle = Math.max(1,Math.min(360,inp.arcAngle));
  var freq = Math.max(20,Math.min(200,inp.couplingFreq));
  var speed = Math.max(330,Math.min(360,inp.c));
  var result;
  try {
    switch (currentType) {
      case 'arc': result=calcArcArray(N,angle,freq,inp.maxWidth,inp.maxDepth,inp.cabW,inp.cabH,inp.cabD,speed); break;
      case 'endfire': result=calcEndfireArray(N,freq,inp.cabW,inp.cabH,inp.cabD,speed); break;
      case 'cardioid': result=calcCardioidFBF(freq,inp.cabW,inp.cabH,inp.cabD,speed); break;
      default: result=calcArcArray(N,angle,freq,inp.maxWidth,inp.maxDepth,inp.cabW,inp.cabH,inp.cabD,speed);
    }
  } catch(e) { console.error(e); document.getElementById('results-content').innerHTML='<div class="no-results">计算出错</div>'; return; }

  // Use user grid extents
  var gxMin=inp.gxMin, gxMax=inp.gxMax, gyMin=inp.gyMin, gyMax=inp.gyMax;
  if (gxMax <= gxMin) gxMax = gxMin+1;
  if (gyMax <= gyMin) gyMax = gyMin+1;
  var splField = computeSPLField(result, 200, gxMin, gxMax, gyMin, gyMax);
  renderResults(result, splField);
}

function renderResults(result, splField) {
  var c = document.getElementById('results-content'), html = '';
  if (result.warnings && result.warnings.length) {
    result.warnings.forEach(function(w){
      var cls = w.indexOf('重叠')>=0?' error':(w.indexOf('提升至箱体')>=0?' info':'');
      html+='<div class="warn-callout'+cls+'">'+(cls===' error'?'⚠ ':'ℹ ')+w+'</div>';
    });
  }
  html+='<div class="summary-grid">';
  if (result.type==='arc') {
    html+='<div class="summary-card"><div class="value">'+result.wavelength.toFixed(3)+' m</div><div class="label">波长 λ</div></div>';
    html+='<div class="summary-card"><div class="value accent">'+result.recSpacing.toFixed(3)+' m</div><div class="label">推荐间距 λ/2</div></div>';
    html+='<div class="summary-card"><div class="value">'+result.actualSpacing.toFixed(3)+' m</div><div class="label">实际间距</div></div>';
    html+='<div class="summary-card"><div class="value">'+result.totalWidth.toFixed(3)+' m</div><div class="label">总宽度</div></div>';
    html+='<div class="summary-card"><div class="value">'+result.virtualR.toFixed(3)+' m</div><div class="label">虚拟弧半径</div></div>';
    if (result.spacingLimitedByCab) html+='<div class="summary-card constrained"><div class="value">'+(result.cabinetW/1000).toFixed(3)+' m</div><div class="label">箱体宽度（间距下限）</div></div>';
  } else if (result.type==='endfire') {
    html+='<div class="summary-card"><div class="value">'+result.wavelength.toFixed(3)+' m</div><div class="label">波长 λ</div></div>';
    html+='<div class="summary-card"><div class="value accent">'+result.recSpacing.toFixed(3)+' m</div><div class="label">推荐间距 λ/4</div></div>';
    html+='<div class="summary-card"><div class="value">'+result.actualSpacing.toFixed(3)+' m</div><div class="label">实际间距</div></div>';
    html+='<div class="summary-card"><div class="value">'+result.totalDepth.toFixed(3)+' m</div><div class="label">总深度</div></div>';
    if (result.spacingLimitedByCab) html+='<div class="summary-card constrained"><div class="value">'+(result.cabinetD/1000).toFixed(3)+' m</div><div class="label">箱体深度（间距下限）</div></div>';
  } else if (result.type==='cardioid') {
    html+='<div class="summary-card"><div class="value">'+result.wavelength.toFixed(3)+' m</div><div class="label">波长 λ</div></div>';
    html+='<div class="summary-card"><div class="value accent">'+result.recSpacing.toFixed(3)+' m</div><div class="label">推荐间距 λ/4</div></div>';
    html+='<div class="summary-card"><div class="value">'+result.actualSpacing.toFixed(3)+' m</div><div class="label">实际间距</div></div>';
    html+='<div class="summary-card"><div class="value">'+result.totalWidth.toFixed(3)+' m</div><div class="label">总宽度</div></div>';
    if (result.spacingLimitedByCab) html+='<div class="summary-card constrained"><div class="value">'+(result.cabinetW/1000).toFixed(3)+' m</div><div class="label">箱体宽度（间距下限）</div></div>';
  }
  html+='</div>';

  // Table
  html+='<table><thead><tr><th>#</th><th>X (m)</th><th>Y (m)</th><th>延时 (ms)</th>';
  if (result.type==='cardioid') html+='<th>极性</th>';
  html+='</tr></thead><tbody>';
  result.positions.forEach(function(pos,i){
    html+='<tr><td class="col-num">'+(i+1)+'</td><td class="col-x">'+pos.x.toFixed(3)+'</td><td class="col-y">'+pos.y.toFixed(3)+'</td><td class="col-delay">'+result.delays[i].toFixed(2)+'</td>';
    if (result.type==='cardioid') { var p=result.polarity[i]; html+='<td class="col-polarity '+(p>0?'polarity-pos':'polarity-neg')+'">'+(p>0?'+':'−')+'</td>'; }
    html+='</tr>';
  });
  html+='</tbody></table>';

  // SPL Heatmap + legend
  html+='<div class="panel-title" style="margin-top:24px">声压级覆盖图 SPL Coverage</div>';
  html+='<div class="diagram-container"><canvas id="spl-canvas"></canvas></div>';
  // 3dB legend with labels
  html+='<div class="legend-row">';
  html+='<span>0dB</span>';
  html+='<div class="legend-bar" style="background: linear-gradient(to right, rgb(220,38,38), rgb(240,80,28), rgb(238,145,18), rgb(228,180,22), rgb(200,205,28), rgb(148,198,32), rgb(92,178,36), rgb(48,155,38), rgb(22,122,34), rgb(10,85,22), rgb(6,55,16));"></div>';
  html+='<span>-30dB</span>';
  html+='</div>';
  html+='<div class="legend-ticks"><span>0</span><span>-3</span><span>-6</span><span>-9</span><span>-12</span><span>-15</span><span>-18</span><span>-21</span><span>-24</span><span>-27</span><span>-30</span></div>';

  // Layout diagram
  html+='<div class="panel-title" style="margin-top:24px">阵列布局 Layout</div>';
  html+='<div class="diagram-container"><canvas id="layout-canvas"></canvas></div>';

  c.innerHTML = html;
  setTimeout(function(){
    var sc=document.getElementById('spl-canvas'); if(sc) drawSPLHeatmap(sc, result, splField);
    var lc=document.getElementById('layout-canvas'); if(lc) drawLayoutDiagram(lc, result);
  }, 50);
}

// Tabs & inputs
document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    tab.classList.add('active'); currentType=tab.dataset.type; updateUI();
  });
});
document.querySelectorAll('input').forEach(function(el){ el.addEventListener('input', updateUI); });
var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(updateUI,150); });
updateUI();
</script>
</body>
</html>
